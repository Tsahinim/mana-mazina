<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מנה מזינה</title>
<meta name="description" content="כותבים מנה, מקבלים תוספות קטנות שהופכות אותה למזינה יותר.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F7F3EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1712" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="מנה מזינה">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Rubik:wght@400;500;600&display=swap">
<style>
:root{
  --bg1:#FBF6EC; --bg2:#EAF5EC; --card:#FFFFFF; --glass:rgba(255,255,255,.78);
  --ink:#14231A; --ink-2:#435347; --muted:#728078; --line:#E1E8E0;
  --herb:#22935A; --herb-2:#187446; --herb-ink:#FFFFFF; --herb-soft:#DFF3E6; --herb-deep:#146339;
  --tomato:#E0533A; --tomato-soft:#FDE6E0; --tomato-deep:#A9341F;
  --yolk:#F5B829; --yolk-soft:#FFF2CF; --yolk-ink:#6A4A00;
  --np:#F0714F; --np-soft:#FDE3DB; --np-ink:#B03C1C;
  --nc:#3D9BE0; --nc-soft:#DCEEFB; --nc-ink:#1B669F;
  --ni:#8B5CF6; --ni-soft:#EAE2FE; --ni-ink:#5A33C2;
  --t1:#DFF3E6; --t2:#FFE7DA; --t3:#FFF2CF; --t4:#E0EEFB; --t5:#EFE6FA; --t6:#FCE3EC;
  --blob1:rgba(224,83,58,.16); --blob2:rgba(34,147,90,.18); --blob3:rgba(245,184,41,.20);
  --shadow:0 1px 2px rgba(20,35,26,.05), 0 8px 24px rgba(20,35,26,.07);
  --shadow-lg:0 2px 6px rgba(20,35,26,.06), 0 18px 40px rgba(20,35,26,.12);
  --r:22px; --r-sm:16px;
  --display:"Fredoka","Rubik",system-ui,sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#0F1712; --bg2:#0F1B15; --card:#18231C; --glass:rgba(24,35,28,.78);
    --ink:#ECF4EE; --ink-2:#B9C8BE; --muted:#8B9B90; --line:#293830;
    --herb:#4FC487; --herb-2:#3AA76E; --herb-ink:#07150D; --herb-soft:#1B3325; --herb-deep:#8EDDB0;
    --tomato:#FF8A70; --tomato-soft:#3B211B; --tomato-deep:#FFB3A1;
    --yolk:#F7C548; --yolk-soft:#372D12; --yolk-ink:#FBE3A0;
    --np:#FF8E6E; --np-soft:#3B221B; --np-ink:#FFBBA6;
    --nc:#62B4F2; --nc-soft:#16293A; --nc-ink:#A6D5FA;
    --ni:#A78BFA; --ni-soft:#261F3D; --ni-ink:#CDBDFD;
    --t1:#1B3325; --t2:#3A261D; --t3:#372D12; --t4:#1A2B3B; --t5:#2A2238; --t6:#3A1F2A;
    --blob1:rgba(255,138,112,.10); --blob2:rgba(79,196,135,.12); --blob3:rgba(247,197,72,.08);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28);
    --shadow-lg:0 2px 6px rgba(0,0,0,.35), 0 18px 40px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html{height:100%;overflow-x:hidden}
body{margin:0;min-height:100%;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 100%) fixed;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(38vmax 30vmax at 92% -6%,var(--blob1),transparent 62%),
             radial-gradient(34vmax 28vmax at -8% 12%,var(--blob2),transparent 60%),
             radial-gradient(30vmax 26vmax at 50% 108%,var(--blob3),transparent 60%)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--herb);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 4px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:21px;color:var(--herb-deep)}
.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--herb),var(--herb-2));display:grid;place-items:center;box-shadow:var(--shadow);font-size:20px}
.iconbtn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;place-items:center;box-shadow:var(--shadow)}
.iconbtn svg{width:22px;height:22px;stroke:var(--ink-2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{flex:1;display:flex;flex-direction:column;padding:4px 20px 0}
.screen{flex:1;display:flex;flex-direction:column;gap:16px;animation:in .28s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-family:var(--display);font-weight:600;font-size:33px;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.2px}
h2{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.2;margin:0;text-wrap:balance}
h3.sec{font-family:var(--display);font-weight:500;font-size:16px;color:var(--ink-2);margin:4px 0 -6px}
.hello{font-family:var(--display);font-weight:500;color:var(--herb-deep);font-size:17px;margin:8px 0 -10px}
.lead{color:var(--ink-2);margin:0}
.small{font-size:15px;color:var(--ink-2)}
.tiny{font-size:14px;color:var(--muted)}
.bento{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{border:0;border-radius:22px;padding:12px 8px 11px;min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;font-size:14.5px;font-weight:500;line-height:1.25;color:var(--ink);box-shadow:var(--shadow);transition:transform .12s ease}
.tile:active{transform:scale(.96)}
.mini{width:56px;height:56px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:29px;line-height:1;flex:none;
  box-shadow:inset 0 0 0 5px var(--card),inset 0 0 0 6.5px var(--line),0 4px 10px rgba(20,35,26,.10)}
.tile:nth-child(6n+1){background:var(--t1)} .tile:nth-child(6n+2){background:var(--t2)} .tile:nth-child(6n+3){background:var(--t3)}
.tile:nth-child(6n+4){background:var(--t4)} .tile:nth-child(6n+5){background:var(--t5)} .tile:nth-child(6n+6){background:var(--t6)}
.tip{display:flex;gap:12px;align-items:flex-start;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);font-size:16px;color:var(--ink-2)}
.tip .em{font-size:26px;line-height:1.1;flex:none}
.tip b{display:block;font-family:var(--display);font-weight:600;font-size:16px;color:var(--ink);margin-bottom:1px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
.crumb{border:1px solid var(--line);background:var(--glass);border-radius:999px;padding:6px 12px;font-size:14px;color:var(--ink-2);min-height:36px}
.crumb b{font-weight:600;color:var(--ink)}
.prog{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--herb),var(--yolk));transition:width .3s ease}
.qhead{display:flex;gap:14px;align-items:center}
.badge{width:66px;height:66px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:33px;flex:none;
  box-shadow:inset 0 0 0 6px var(--card),inset 0 0 0 7.5px var(--line),0 6px 14px rgba(20,35,26,.12)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{width:100%;text-align:right;border:2px solid transparent;background:var(--card);border-radius:var(--r);padding:14px 16px;min-height:62px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);transition:transform .12s ease,border-color .15s ease,background .15s ease}
.opt:active{transform:scale(.985)}
.opt .em{font-size:26px;line-height:1;flex:none;width:34px;text-align:center}
.opt .t{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.opt .t>span{font-weight:500}
.opt .t small{font-size:14px;color:var(--ink-2);font-weight:400}
.opt.def{border-color:var(--herb)}
.pill{font-size:12px;font-weight:600;color:var(--herb-deep);background:var(--herb-soft);padding:3px 9px;border-radius:999px;white-space:nowrap;flex:none}
.opt.sel{border-color:var(--herb);background:var(--herb-soft)}
.opt.ghost{background:transparent;border:2px dashed var(--line);box-shadow:none;color:var(--ink-2)}
.opt.ghost:disabled{opacity:.6}
.gives{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.gives i{font-style:normal;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--yolk-soft);color:var(--yolk-ink)}
.gives i.np{background:var(--np-soft);color:var(--np-ink)} .gives i.nc{background:var(--nc-soft);color:var(--nc-ink)} .gives i.ni{background:var(--ni-soft);color:var(--ni-ink)} .gives i.ng{background:var(--herb-soft);color:var(--herb-deep)}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;background:var(--card)}
.opt.sel .check{background:var(--herb);border-color:var(--herb)}
.opt.sel .check::after{content:"";width:7px;height:12px;border:solid var(--herb-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.plate{flex:none;width:44px;height:44px;display:grid;place-items:center}
.plate i{display:block;border-radius:50%;background:var(--herb-soft);border:3px solid var(--herb)}
.step{display:flex;align-items:center;gap:6px;margin-top:8px}
.step em{font-style:normal;font-size:13px;color:var(--ink-2);margin-inline-start:4px}
.step button{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);font-size:22px;line-height:1;color:var(--herb-deep);box-shadow:var(--shadow)}
.step output{min-width:22px;text-align:center;font-weight:600}
.tag{display:inline-block;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600;margin:0 0 4px 2px}
.tag.has{background:var(--herb-soft);color:var(--herb-deep)}
.tag.miss{background:var(--tomato-soft);color:var(--tomato-deep)}
.tag.est{background:var(--yolk-soft);color:var(--yolk-ink);padding:2px 9px;font-size:12px;margin:0}
.other{display:flex;gap:8px}
.field{flex:1;border:2px solid var(--line);background:var(--card);border-radius:var(--r-sm);padding:13px 14px;min-height:54px;width:100%}
.field:focus{border-color:var(--herb);outline:none}
textarea.field{resize:vertical}
.cta{width:100%;border:0;border-radius:999px;background:linear-gradient(135deg,var(--herb),var(--herb-2));color:var(--herb-ink);font-family:var(--display);font-weight:600;font-size:19px;padding:16px;min-height:60px;box-shadow:var(--shadow-lg);transition:transform .12s ease}
.cta:active{transform:scale(.98)}
.cta.sec{background:var(--card);color:var(--herb-deep);box-shadow:var(--shadow);border:2px solid var(--herb-soft)}
.cta.mini{width:auto;min-height:54px;padding:0 22px;font-size:17px;border-radius:var(--r-sm)}
.cta:disabled{opacity:.55}
.bottom{margin-top:auto;display:flex;flex-direction:column;gap:10px;position:sticky;bottom:0;padding:14px 0 calc(16px + env(safe-area-inset-bottom,0px));z-index:5}
.bottom.flat{position:static;padding-top:4px}
.bottom.flat::before{display:none}
.bottom::before{content:"";position:absolute;inset:-18px -20px 0;z-index:-1;background:linear-gradient(to top,var(--bg2) 62%,transparent)}
.ask{display:flex;gap:8px;align-items:center;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:2px solid var(--card);border-radius:999px;padding:6px 6px 6px 8px;box-shadow:var(--shadow-lg);transition:border-color .15s ease}
.ask:focus-within{border-color:var(--herb)}
.ask input{flex:1;border:0;background:transparent;padding:10px 14px;min-height:48px;outline:none;min-width:0}
.ask input::placeholder{color:var(--muted)}
.go{width:50px;height:50px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--herb),var(--herb-2));display:grid;place-items:center;flex:none;transition:transform .12s ease}
.go:active{transform:scale(.92)}
.go svg{width:22px;height:22px;stroke:var(--herb-ink);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.plateSvg{display:block;max-width:100%;height:auto;overflow:visible}
.plateSvg circle{fill:none}
.plateSvg .trk,.plateSvg .bas,.plateSvg .add{stroke-width:13;stroke-linecap:round}
.plateSvg .bas,.plateSvg .add{transition:stroke-dasharray .7s cubic-bezier(.2,.8,.2,1)}
.np .trk{stroke:var(--np-soft)} .np .bas{stroke:var(--np)} .np .add{stroke:var(--np);opacity:.42}
.nc .trk{stroke:var(--nc-soft)} .nc .bas{stroke:var(--nc)} .nc .add{stroke:var(--nc);opacity:.42}
.ni .trk{stroke:var(--ni-soft)} .ni .bas{stroke:var(--ni)} .ni .add{stroke:var(--ni);opacity:.42}
.plateSvg .dish{fill:var(--card);filter:drop-shadow(0 8px 16px rgba(20,35,26,.16))}
.plateSvg .rim{stroke:var(--line);stroke-width:2}
.plateSvg .ctr{font-size:48px}
.plateSvg .garnish text{font-size:22px;transform-box:fill-box;transform-origin:center;animation:pop .35s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
.spin .arcs{animation:rot 1.6s linear infinite;transform-origin:100px 100px}
@keyframes rot{to{transform:rotate(360deg)}}
.live{position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:6;display:flex;gap:12px;align-items:center;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:28px;padding:10px 14px 10px 16px;box-shadow:var(--shadow-lg)}
.live .plateSvg{width:112px;flex:none}
.nrows{flex:1;display:flex;flex-direction:column;gap:7px;min-width:0}
.nrow{display:flex;align-items:center;gap:7px;font-size:14.5px;line-height:1.2}
.nrow .dot{width:11px;height:11px;border-radius:50%;flex:none}
.np .dot{background:var(--np)} .nc .dot{background:var(--nc)} .ni .dot{background:var(--ni)}
.nrow b{font-family:var(--display);font-weight:600;font-size:15.5px}
.nrow .val{color:var(--ink-2);margin-inline-start:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.nrow .plus{font-size:12.5px;font-weight:600;border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums}
.np .plus{background:var(--np-soft);color:var(--np-ink)} .nc .plus{background:var(--nc-soft);color:var(--nc-ink)} .ni .plus{background:var(--ni-soft);color:var(--ni-ink)}
.nrows.big{gap:10px}
.nrows.big .nrow{font-size:16px;background:var(--card);border-radius:18px;padding:11px 14px;box-shadow:var(--shadow);flex-wrap:wrap;row-gap:2px}
.nrows.big .val{order:9;flex-basis:100%;margin:0;padding-inline-start:18px;font-size:14.5px;text-align:right}
.nrows.big .pct{margin-inline-start:auto}
.nrows.big .nrow b{font-size:17px}
.nrows.big .pct{font-family:var(--display);font-weight:600;font-size:18px;min-width:50px;text-align:left}
.np .pct{color:var(--np-ink)} .nc .pct{color:var(--nc-ink)} .ni .pct{color:var(--ni-ink)}
.sumhero{border-radius:30px;padding:18px 16px 16px;background:linear-gradient(160deg,var(--herb-soft) 0%,var(--yolk-soft) 100%);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.sumhero .name{font-size:15px;color:var(--ink-2)}
.sumhero .plateSvg{width:min(236px,68vw)}
.sumhero .kcal{font-family:var(--display);font-weight:600;font-size:38px;line-height:1}
.sumhero .kcal small{font-size:15px;font-weight:500;color:var(--ink-2)}
.sumhero .nrows{align-self:stretch;text-align:right}
.homehero{display:flex;gap:10px;align-items:center}
.homehero .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.homehero .plateSvg{width:118px;flex:none;margin-inline-end:-6px}
.homehero .ctr{transition:opacity .35s ease}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card h2{font-size:20px;margin:0 0 12px}
.hero{border-radius:26px;padding:20px;color:#fff;background:linear-gradient(135deg,#22935A 0%,#187446 60%,#125C38 100%);box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.10);left:-50px;top:-60px}
.hero .em{font-size:40px;line-height:1;position:relative;z-index:1}
.hero .name{font-size:15px;opacity:.92;margin-top:8px;position:relative;z-index:1}
.hero .kcal{font-family:var(--display);font-weight:600;font-size:36px;line-height:1.1;position:relative;z-index:1}
.hero .kcal small{font-size:15px;font-weight:500;opacity:.9}
.rings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.ring{display:flex;flex-direction:column;align-items:center;gap:4px}
.ring svg{width:100%;max-width:104px;height:auto;transform:rotate(-90deg)}
.ring .bg{stroke:var(--line)} .ring .b1{stroke:var(--herb)} .ring .b2{stroke:var(--yolk)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dasharray .7s ease}
.ring .pct{font-family:var(--display);font-weight:600;font-size:22px;margin-top:-70px;height:66px;display:grid;place-items:center}
.ring b{font-family:var(--display);font-weight:600;font-size:16px}
.ring small{font-size:13px;color:var(--ink-2);line-height:1.3}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:13px;color:var(--ink-2);margin-top:12px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:5px;vertical-align:-1px}
.legend .l1::before{background:var(--herb)} .legend .l2::before{background:var(--yolk)}
.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.list li{display:flex;gap:12px;align-items:center;font-size:16px}
.list .em{width:42px;height:42px;border-radius:14px;background:var(--yolk-soft);display:grid;place-items:center;font-size:22px;flex:none}
.vals{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.vals th,.vals td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.vals tbody th{text-align:right;font-weight:500;color:var(--ink-2)}
.vals thead th{font-weight:600;font-size:13px;color:var(--ink-2)}
.vals td:nth-child(4){font-weight:700}
.mean{display:flex;flex-direction:column;gap:12px}
.mean .row{display:flex;gap:12px;align-items:flex-start;font-size:16px;color:var(--ink-2)}
.mean .row .em{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-size:20px;flex:none;background:var(--herb-soft)}
.mean .row b{color:var(--ink)}
.mean .sumline{font-size:17px;color:var(--ink);margin:0}
.note{font-size:14px;color:var(--muted);margin:0}
.banner{background:var(--yolk-soft);color:var(--yolk-ink);border-radius:var(--r-sm);padding:10px 14px;font-size:15px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.banner button{border:0;background:transparent;color:inherit;font-weight:600;text-decoration:underline;min-height:40px;padding:0 4px;white-space:nowrap}
.err{background:var(--tomato-soft);color:var(--tomato-deep);border-radius:var(--r);padding:16px;font-size:17px}
.err details{margin-top:8px;font-size:13px;direction:ltr;text-align:left;color:var(--ink-2)}

/* ---------- אחסון מקומי ---------- */
const LS = "mana.v1";
const S = Object.assign({
  name:"", birth:"", kosher:true, waitHours:1, favs:DEFAULT_FAVS.slice(), dislikes:DEFAULT_DISLIKES,
  off:[], model:"claude-opus-5", apiKey:""

/* ---------- עזרים ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const main = $("#main");
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const n0 = x=>Math.round(x||0);
const n1 = x=>{const v=Math.round((x||0)*10)/10; return Number.isInteger(v)?String(v):v.toFixed(1);};
const fmt = x=>n0(x).toLocaleString("he-IL");
const r10 = x=>(Math.round((x||0)/10)*10).toLocaleString("he-IL");      // הערכות לא מציגים בדיוק של יחידה
function ageBand(){
  if(!S.birth) return "young";
  const b=new Date(S.birth), t=new Date(); let a=t.getFullYear()-b.getFullYear();
  if(t<new Date(t.getFullYear(),b.getMonth(),b.getDate())) a--;
  return a>=14?"teen":"young";
}
const T = ()=>TARGETS[ageBand()];
const who = ()=>S.name?S.name:"הילדה";
const activeAdds = ()=>ADDS.filter(a=>!S.off.includes(a.id));
function hello(){ const h=new Date().getHours(); return h<5?"לילה טוב":h<12?"בוקר טוב":h<17?"צהריים טובים":h<21?"ערב טוב":"לילה טוב"; }

/* ---------- הצלחת החיה ---------- */
const NUTS=[{k:"p",name:"חלבון",unit:"גרם",dec:true,cls:"np",t:"protein"},{k:"ca",name:"סידן",unit:'מ"ג',dec:false,cls:"nc",t:"calcium"},{k:"fe",name:"ברזל",unit:'מ"ג',dec:true,cls:"ni",t:"iron"}];
const GIVE_CLS={"חלבון":"np","סידן":"nc","ברזל":"ni","ויטמין C":"ng","ירק":"ng"};
const PR=84, PC=2*Math.PI*PR, SEG=PC*0.3;
function plateHTML(center){
  const secs=NUTS.map((n,i)=>`<g transform="rotate(${-90+i*120+6} 100 100)" class="${n.cls}">
    <circle class="trk" cx="100" cy="100" r="${PR}" stroke-dasharray="${SEG.toFixed(1)} ${PC.toFixed(1)}"/>
    <circle class="add" data-k="${n.k}a" cx="100" cy="100" r="${PR}" stroke-dasharray="0 ${PC.toFixed(1)}" style="visibility:hidden"/>
    <circle class="bas" data-k="${n.k}b" cx="100" cy="100" r="${PR}" stroke-dasharray="0 ${PC.toFixed(1)}" style="visibility:hidden"/></g>`).join("");
  return `<svg class="plateSvg" viewBox="0 0 200 200" aria-hidden="true"><g class="arcs">${secs}</g>
    <circle class="dish" cx="100" cy="100" r="64"/><circle class="rim" cx="100" cy="100" r="50"/>
    <text class="ctr" x="100" y="97" text-anchor="middle" dominant-baseline="central">${center}</text><g class="garnish"></g></svg>`;
}
function setArcs(root,v){
  for(const n of NUTS){ const x=v[n.k], pb=Math.min(1,x.b/x.t), pt=Math.min(1,(x.b+x.a)/x.t);
    const bas=root.querySelector(`[data-k="${n.k}b"]`), ad=root.querySelector(`[data-k="${n.k}a"]`); if(!bas) continue;
    bas.setAttribute("stroke-dasharray",`${(pb*SEG).toFixed(1)} ${PC.toFixed(1)}`); bas.style.visibility=pb*SEG<1?"hidden":"visible";
    ad.setAttribute("stroke-dasharray",`${(pt*SEG).toFixed(1)} ${PC.toFixed(1)}`); ad.style.visibility=(pt-pb)*SEG<1?"hidden":"visible"; }
}
function setGarnish(root,ems){
  const g=root.querySelector(".garnish"); if(!g) return; ems=ems.slice(0,6); const n=ems.length;
  const key=ems.join(""); if(g.dataset.key===key) return; g.dataset.key=key;
  g.innerHTML=ems.map((e,i)=>{ const deg=n===1?90:150-i*(120/(n-1)), a=deg*Math.PI/180;
    return `<text x="${(100+43*Math.cos(a)).toFixed(1)}" y="${(104+36*Math.sin(a)).toFixed(1)}" text-anchor="middle" dominant-baseline="central">${e}</text>`; }).join("");
}
function nrowsHTML(big){
  return `<div class="nrows ${big?"big":""}">${NUTS.map(n=>`<div class="nrow ${n.cls}"><span class="dot"></span><b>${n.name}</b><span class="plus" data-plus="${n.k}" hidden></span><span class="val"><span data-v="${n.k}">0</span> מתוך ${fmt(T()[n.t])} ${n.unit}</span>${big?`<span class="pct" data-pc="${n.k}">0%</span>`:""}</div>`).join("")}</div>`;
}
function curVals(){ const {base,add}=totals(), t=T();
  return {p:{b:base.protein_g,a:add.protein_g,t:t.protein}, ca:{b:base.calcium_mg,a:add.calcium_mg,t:t.calcium}, fe:{b:base.iron_mg,a:add.iron_mg,t:t.iron}}; }
function paintPlate(root){
  const v=curVals(); setArcs(root,v);
  for(const n of NUTS){ const x=v[n.k], f=n.dec?n1:fmt, ft=n.k==="p"?fmt:n.k==="ca"?r10:n1;
    const val=root.querySelector(`[data-v="${n.k}"]`); if(val) val.textContent=ft(x.b+x.a);
    const pl=root.querySelector(`[data-plus="${n.k}"]`); if(pl){ pl.hidden=x.a<(n.dec?0.05:1); pl.textContent="+"+f(x.a); }
    const pc=root.querySelector(`[data-pc="${n.k}"]`); if(pc) pc.textContent=n0((x.b+x.a)/x.t*100)+"%"; }
  setGarnish(root,[...Object.keys(F.picked).map(id=>ADD_EMO[id]||"🍽️"),...F.customs.map(()=>"✏️")]);
}

/* ---------- קלוד ---------- */
let _sdk=null;
async function loadSdk(){ if(!_sdk){ const m=await import(SDK_URL); _sdk=m.default; } return _sdk; }
class AppErr extends Error{ constructor(code,detail){ super(code); this.code=code; this.detail=detail; } }

async function askClaude(system,user,schema){
  let Anthropic;
  try{ Anthropic=await loadSdk(); }catch(e){ throw new AppErr("sdk",String(e)); }
  const client=new Anthropic({apiKey:S.apiKey, dangerouslyAllowBrowser:true});
  const model=S.model||"claude-opus-5";
  const base={ model, max_tokens:8000, system, messages:[{role:"user",content:user}],
               output_config:{ format:{type:"json_schema",schema} } };
  if(model!=="claude-haiku-4-5"){ base.output_config.effort="low"; if(S.fast===true) base.thinking={type:"disabled"}; }   // נמדד: חוסך רק כשנייה, ולכן כבוי כברירת מחדל
  let r;
  try{
    if(model==="claude-opus-5"){
      try{ r=await client.beta.messages.create({...base, betas:["server-side-fallback-2026-07-01"], fallbacks:"default"}); }
      catch(e){ if(e instanceof Anthropic.BadRequestError) r=await client.messages.create(base); else throw e; }
    } else r=await client.messages.create(base);
  }catch(e){
    if(e instanceof Anthropic.AuthenticationError) throw new AppErr("auth",e.message);
    if(e instanceof Anthropic.PermissionDeniedError) throw new AppErr("perm",e.message);
    if(e instanceof Anthropic.RateLimitError) throw new AppErr("rate",e.message);
    if(e instanceof Anthropic.BadRequestError) throw new AppErr("bad",e.message);
    if(e instanceof Anthropic.APIConnectionError) throw new AppErr("net",e.message);
    if(e instanceof Anthropic.APIError) throw new AppErr("api",(e.status||"")+" "+e.message);
    throw new AppErr("net",String(e));
  }
  track(r);
  if(r.stop_reason==="refusal") throw new AppErr("refusal","");
  if(r.stop_reason==="max_tokens") throw new AppErr("long","");
  const text=r.content.filter(b=>b.type==="text").map(b=>b.text).join("");
  try{ return JSON.parse(text); }catch(e){ throw new AppErr("parse",text.slice(0,300)); }
}

const PRICE={"claude-opus-5":[5,25],"claude-sonnet-5":[2,10],"claude-haiku-4-5":[1,5]};   // דולר למיליון טוקנים: קלט, פלט
function track(r){
  try{ const u=r.usage||{}, m=r.model&&PRICE[r.model]?r.model:(S.model||"claude-opus-5"), pr=PRICE[m]||PRICE["claude-opus-5"];
    const i=(u.input_tokens||0)+(u.cache_creation_input_tokens||0)+(u.cache_read_input_tokens||0), o=u.output_tokens||0, c=(i*pr[0]+o*pr[1])/1e6;
    const st=S.stats||{calls:0,inTok:0,outTok:0,usd:0}; st.calls++; st.inTok+=i; st.outTok+=o; st.usd+=c; S.stats=st; save();

}

  const tot={kcal:base.kcal+add.kcal,p:base.protein_g+add.protein_g,ca:base.calcium_mg+add.calcium_mg,fe:base.iron_mg+add.iron_mg};
  const pc=x=>n0(x*100);
  const what=l=>[l.p>=0.5?`${n1(l.p)} גרם חלבון`:"", l.ca>=5?`${fmt(l.ca)} מ"ג סידן`:"", l.fe>=0.2?`${n1(l.fe)} מ"ג ברזל`:"", `${fmt(l.kcal)} קלוריות`].filter(Boolean).join(" · ");
  const later=(F.b.later||[]).filter(Boolean).slice(0,3);
  render(`<section class="screen">${crumbs()}
    <div class="sumhero" id="sumPlate">
      <div class="name">${esc(F.a.dish_name)}${lines.length?" עם "+esc(lines.map(l=>l.label).join(", ")):""}</div>
      ${plateHTML(emo(F.a.dish_name))}
      <div class="kcal">${r10(tot.kcal)} <small>קלוריות, בערך</small></div>
      ${nrowsHTML(true)}
      <div class="tiny">${lines.length?"צבע מלא: המנה עצמה. צבע בהיר: התוספות. ":""}היעד הוא של יום שלם, גיל ${t.label}.</div></div>
    ${lines.length?`<div class="card"><h2>מה התוספות הוסיפו</h2><ul class="list">${lines.map(l=>`<li><span class="em" aria-hidden="true">${l.em}</span><span><b>${esc(l.label)}</b>${l.est?` <span class="tag est">הערכה</span>`:""}<br><span class="small">${what(l)}</span></span></li>`).join("")}</ul></div>`:""}
    <div class="card mean"><h2 style="margin-bottom:0">מה המשמעות</h2>
      <p class="sumline">הארוחה הזו נותנת בערך <b>${pc(tot.p/t.protein)}%</b> מהחלבון, <b>${pc(tot.ca/t.calcium)}%</b> מהסידן ו-<b>${pc(tot.fe/t.iron)}%</b> מהברזל של יום שלם.</p>
      <div class="row"><span class="em" aria-hidden="true">🦴</span><span><b>סידן</b> בונה את העצם, ובגיל הזה נבנית רוב מסת העצם לכל החיים. לכן זה הרכיב שהכי שווה להשלים.${tot.ca/t.calcium<0.2?" בארוחה הזו יש ממנו מעט, אז כדאי שארוחה אחרת היום תכלול גבינה, יוגורט או שוקו.":""}</span></div>
      <div class="row"><span class="em" aria-hidden="true">💪</span><span><b>חלבון</b> בונה שריר, עצם ורקמות. עדיף לפזר אותו על פני היום ולא להשלים הכל בערב.</span></div>
      <div class="row"><span class="em" aria-hidden="true">⚡</span><span><b>ברזל</b> נחוץ לאנרגיה, לריכוז ולגדילה.${vitc?" יש בארוחה ויטמין C, והוא משפר את ספיגת הברזל מהצומח.":" עגבנייה, פלפל או פרי הדר באותה ארוחה משפרים את הספיגה שלו מהצומח."}${ageBand()==="young"?' מגיל 14 היעד עולה ל-15 מ"ג.':""}</span></div>
      <div class="row"><span class="em" aria-hidden="true">🔥</span><span><b>קלוריות</b> הן הדלק של הגדילה. אין כאן יעד ואין ציון: המטרה היא רק שלא יחסר.</span></div>
    </div>
    <div class="card"><h2>מה נכנס לחישוב</h2><ul class="plain">
      <li><b>המנה:</b> ${esc(F.a.dish_name)}</li>
      ${F.answers.length?`<li><b>פרטים:</b> ${esc(F.answers.map(x=>x.a).join(", "))}</li>`:""}
      <li><b>כמות:</b> ${esc(F.portion.label)}${F.portion.desc&&F.portion.desc!==F.portion.label?" ("+esc(F.portion.desc)+")":""}</li>
      ${lines.length?`<li><b>תוספות:</b> ${esc(lines.map(l=>l.label+": "+l.amount).join("; "))}</li>`:""}
      ${F.b.base_note?`<li><b>הנחת החישוב:</b> ${esc(F.b.base_note)}</li>`:""}</ul>
      <details style="margin-top:12px"><summary style="cursor:pointer;font-weight:600;color:var(--herb-deep)">טבלת ערכים מלאה</summary>
      <div style="overflow-x:auto;margin-top:8px"><table class="vals"><thead><tr><th></th><th>המנה</th><th>תוספות</th><th>סך הכל</th><th>יעד ליום</th></tr></thead><tbody>
        <tr><th>קלוריות</th><td>${r10(base.kcal)}</td><td>${fmt(add.kcal)}</td><td>${r10(tot.kcal)}</td><td>אין יעד</td></tr>
        <tr><th>חלבון, גרם</th><td>${fmt(base.protein_g)}</td><td>${n1(add.protein_g)}</td><td>${fmt(tot.p)}</td><td>${t.protein}</td></tr>
        <tr><th>סידן, מ"ג</th><td>${r10(base.calcium_mg)}</td><td>${fmt(add.calcium_mg)}</td><td>${r10(tot.ca)}</td><td>${fmt(t.calcium)}</td></tr>
        <tr><th>ברזל, מ"ג</th><td>${n1(base.iron_mg)}</td><td>${n1(add.iron_mg)}</td><td>${n1(tot.fe)}</td><td>${t.iron}</td></tr>
        <tr><th>ויטמין C, מ"ג</th><td>${fmt(base.vitc_mg)}</td><td>${fmt(add.vitc_mg)}</td><td>${fmt((base.vitc_mg||0)+add.vitc_mg)}</td><td>45</td></tr>
      </tbody></table></div>
      <p class="tiny" style="margin:8px 0 0">ערכי המנה הם הערכה של קלוד לפי טבלאות הרכב מזון. ערכי התוספות קבועים (USDA)${lines.some(l=>l.est)?", חוץ מאלה שמסומנות הערכה":""}. היעדים: ההמלצות היומיות לגיל ${t.label} (DRI).</p></details></div>
    ${later.length?`<div class="card"><h2>מה כדאי להשלים בהמשך היום</h2><ul class="plain">${later.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
    <p class="note">המידע כללי ואינו תחליף לרופא או לדיאטנית ילדים.${F.demo?" זו מנת הדגמה.":""}</p>
    <div class="bottom flat"><button class="cta" id="new">מנה חדשה</button><div class="linkrow"><button class="link" id="edit">שינוי התוספות</button></div></div></section>`);
  later2(()=>paintPlate($("#sumPlate")));
  $("#new").onclick=home; $("#edit").onclick=()=>screenAdds(true); bindCrumbs();
}
function bindCrumbs(){
  main.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{
    const g=b.dataset.go;
    if(g==="home") return home();
    if(g==="portion"){ F.portion=null; F.b=null; F.picked={}; F.customs=[]; F.shown=4; return screenPortion(); }
    const i=+g.slice(1); F.qi=i; F.answers.length=i; F.portion=null; F.meatRecent=null; F.b=null; F.picked={}; F.customs=[]; F.shown=4; screenQ();
  });
}

/* ---------- חלוניות ---------- */
const sheetRoot=$("#sheetRoot");
function openSheet(title,body,onReady){
  sheetRoot.innerHTML=`<div class="sheet" id="sh"><div class="panel" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grab" aria-hidden="true"></div><header><h3>${esc(title)}</h3><button class="iconbtn" id="shX" aria-label="סגירה"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>${body}</div></div>`;
  const close=()=>{ sheetRoot.innerHTML=""; if(!F) home(); };
  $("#shX").onclick=close; $("#sh").onclick=e=>{ if(e.target.id==="sh") close(); };
  if(onReady) onReady(close);
}
function sheetTips(){
  openSheet("טיפים לגדילה",`<p class="lead">האוכל הוא רק חלק מהתמונה. אלה הדברים שהמחקר מצא שתומכים בגדילה ובבניית עצם בגיל הזה.</p>
  ${TIP_GROUPS.map(g=>`<div class="card"><h2><span aria-hidden="true">${g.em}</span> ${esc(g.title)}</h2><div class="mean">${g.items.map(t=>`<div class="row" style="display:block"><b>${esc(t[0])}.</b> ${esc(t[1])}</div>`).join("")}</div></div>`).join("")}
  <details class="card"><summary style="font-family:var(--display);font-weight:600;font-size:17px;cursor:pointer">מתי כדאי להתייעץ עם רופא ילדים</summary>
    <p class="small">רוב הזמן מספיקים מעקב רגוע ותזונה טובה. כדאי להתייעץ אם מופיע אחד מאלה:</p><ul class="plain">${DOCTOR.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></details>
  <div class="linkrow"><button class="link" id="tipHow">איך האפליקציה עובדת, ומה המקורות</button></div>`,
  ()=>{ $("#tipHow").onclick=()=>{ sheetRoot.innerHTML=""; sheetHow(); }; });
}
function sheetHow(){ openSheet("איך זה עובד",`<div class="card"><ul class="plain">
  <li>כותבים מנה. קלוד שואל עד 2 שאלות, ומעריך את הערכים שלה. זו <b>הערכה</b>, כי אף אחד לא שקל את הצלחת.</li>
  <li>התוספות מגיעות רק מרשימה סגורה שאישרתם בהגדרות. קלוד בוחר מתוכה ולא ממציא.</li>
  <li>הערכים של כל תוספת קבועים באפליקציה, ממאגר משרד החקלאות האמריקאי (USDA). תוספת שעוד לא אומתה מסומנת "הערכה".</li>
  <li>היעדים היומיים הם ההמלצות הרשמיות לגיל (DRI). אף תוספת לא "מגביהה": המטרה היא שלא יחסר לגוף מה שהוא צריך כדי לגדול.</li>
  <li>שום דבר לא נשמר בשרת. השם, ההעדפות והמפתח נשמרים רק בטלפון הזה.</li></ul></div>
  <h4>מקורות</h4><div class="src">${SOURCES.map(esc).join("<br>")}</div>`); }
function sheetSettings(focus,msg){
  const groups={dairy:"🧀 חלבי",egg:"🥚 ביצים",protein:"🍗 בשר ודגים",fat:"🫒 אנרגיה",side:"🥙 בצד",veg:"🍊 ירק ופרי"};
  const secKey=`<h4 id="keySec">חיבור לקלוד</h4>
  <p class="tiny" style="margin:0">המפתח נשמר רק במכשיר הזה ונשלח רק ל-Anthropic. אל תשלחו אותו לאף אחד, גם לא בצ'אט.</p>
  <label class="f">מפתח API (מדביקים כאן)<input class="field" id="sKey" type="password" dir="ltr" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="sk-ant-..." value="${esc(S.apiKey)}"></label>
  <label class="f">מודל<select class="field" id="sModel">${MODELS.map(m=>`<option value="${m.id}" ${S.model===m.id?"selected":""}>${esc(m.name)} (${esc(m.note)})</option>`).join("")}</select></label>
  <div id="keyMsg" class="small" aria-live="polite"></div>
  ${S.stats&&S.stats.calls?`<p class="tiny" style="margin:0">שימוש במכשיר הזה עד עכשיו: ${S.stats.calls} פניות לקלוד, בערך ${S.stats.usd.toFixed(2)} דולר.</p>`:""}
  <button class="cta sec" id="sTest">בדיקת החיבור</button>`;
  const body=`${msg?`<div class="banner"><span>${esc(msg)}</span></div>`:""}
  ${S.apiKey?"":secKey}
  <h4>הילדה</h4>
  <label class="f">שם פרטי (נשמר רק בטלפון הזה)<input class="field" id="sName" type="text" value="${esc(S.name)}" autocomplete="off"></label>
  <label class="f">תאריך לידה (קובע את היעדים היומיים)<input class="field" id="sBirth" type="date" value="${esc(S.birth)}"></label>
  <label class="f">מנות קבועות, מופרדות בפסיק<textarea class="field" id="sFavs" rows="3">${esc(S.favs.join(", "))}</textarea></label>
  <label class="f">מה היא לא אוכלת<input class="field" id="sDis" type="text" value="${esc(S.dislikes)}"></label>
  <h4>בשר וחלב</h4>
  <div class="rowf"><span>לא משלבים בשר וחלב באותה ארוחה</span><input class="switch" type="checkbox" id="sKosher" ${S.kosher?"checked":""} aria-label="לא משלבים בשר וחלב באותה ארוחה"></div>
  <label class="f">כמה שעות מחכים אחרי בשר לפני מוצרי חלב<input class="field" id="sWait" type="number" min="0" max="6" step="1" inputmode="numeric" value="${esc(S.waitHours)}"></label>
  <h4>התוספות המאושרות</h4><p class="tiny" style="margin:0">רק מה שמסומן יוצע. כבו מה שהיא לא תסכים לו.</p>
  ${Object.entries(groups).map(([g,name])=>{const l=ADDS.filter(a=>a.g===g); return l.length?`<p class="small" style="margin:8px 0 0"><b>${name}</b></p>`+l.map(a=>`<div class="rowf"><span>${esc(a.label)} <span class="tiny">${esc(a.amount)}</span></span><input class="switch" type="checkbox" data-add="${a.id}" ${S.off.includes(a.id)?"":"checked"} aria-label="${esc(a.label)}"></div>`).join(""):"";}).join("")}
  ${S.apiKey?secKey:""}
  <button class="cta" id="sSave">שמירה</button>
  <div class="linkrow"><button class="link" id="sWipe">מחיקת המפתח מהטלפון הזה</button>${S.memo&&Object.keys(S.memo).length?`<button class="link" id="sForget">שכח מנות שמורות (${Object.keys(S.memo).length})</button>`:""}</div>`;
  openSheet("הגדרות",body,close=>{
    const read=()=>{ S.name=$("#sName").value.trim(); S.birth=$("#sBirth").value; S.favs=$("#sFavs").value.split(/[,\n]/).map(x=>x.trim()).filter(Boolean);
      if(!S.favs.length) S.favs=DEFAULT_FAVS.slice(); S.dislikes=$("#sDis").value.trim(); S.kosher=$("#sKosher").checked;
      S.waitHours=Math.max(0,Math.min(6,parseInt($("#sWait").value,10)||0)); S.apiKey=$("#sKey").value.trim(); S.model=$("#sModel").value;
      S.off=[...sheetRoot.querySelectorAll("[data-add]")].filter(x=>!x.checked).map(x=>x.dataset.add); save(); };
    $("#sSave").onclick=()=>{ read(); sheetRoot.innerHTML=""; home(); };
    const fg=$("#sForget"); if(fg) fg.onclick=()=>{ S.memo={}; save(); fg.textContent="נמחק"; fg.disabled=true; };
    $("#sWipe").onclick=()=>{ $("#sKey").value=""; read(); $("#keyMsg").textContent="המפתח נמחק מהטלפון הזה."; };
    $("#sTest").onclick=async()=>{ read(); const m=$("#keyMsg"); if(!S.apiKey){ m.textContent="קודם הדביקו מפתח."; return; }
      m.textContent="בודק..."; try{ const r=await askClaude("ענה ב-JSON בלבד.","החזר ok=true",{type:"object",additionalProperties:false,required:["ok"],properties:{ok:{type:"boolean"}}}); m.textContent=r.ok?"החיבור עובד ✅":"התקבלה תשובה לא צפויה."; }
      catch(e){ m.textContent={auth:"המפתח לא תקין.",perm:"למפתח אין הרשאה למודל הזה.",bad:"הבקשה נדחתה. ייתכן שאין יתרה בחשבון.",net:"אין חיבור לאינטרנט.",rate:"יותר מדי בקשות, נסו בעוד דקה.",sdk:"רכיב החיבור לא נטען."}[e.code]||"החיבור לא הצליח."; } };
    if(focus==="key") setTimeout(()=>{ $("#keySec").scrollIntoView({block:"start"}); $("#sKey").focus(); },50);
  });
}
$("#btnSettings").onclick=()=>sheetSettings();
$("#btnTips").onclick=sheetTips;

/* ---------- התחלה ---------- */
home();
</script>
